[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upstream-capability-probe"
version = "0.1.0"
description = "Safe, redacted capability probe for OpenAI-style upstream endpoints."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
upstream-capability-probe = "upstream_capability_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
