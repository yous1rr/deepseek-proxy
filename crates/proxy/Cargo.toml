[package]
name = "proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "deepseek-rs"
path = "src/main.rs"

[dependencies]
pow = { path = "../pow" }
protocol = { path = "../protocol" }
client = { path = "../client" }
responses-core = { path = "../responses-core" }
tool-engine = { path = "../tool-engine" }
chatgpt-client = { path = "../chatgpt-client" }
chatgpt-protocol = { path = "../chatgpt-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
reqwest.workspace = true
axum = "0.8"
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64.workspace = true
hex = "0.4"
thiserror.workspace = true
toml = "0.8"
libc = "0.2"
jsonschema.workspace = true
tiktoken-rs = "0.12.1"

# Windows-only: process liveness and termination for the background
# start/stop/status lifecycle (there is no libc::kill on Windows).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
