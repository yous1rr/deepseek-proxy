# deepseek-rs configuration.
#
# Precedence: environment variables > this file > built-in defaults.
# Every key is optional; delete a line to fall back to the default.
#
# Credentials are NOT here — they live in ../deepseek/.env or the environment
# (DEEPSEEK_EMAIL_<n> / DEEPSEEK_PASSWORD_<n> / DEEPSEEK_TOKEN_<n>), one per
# account, numbered from 0.

[proxy]
host = "0.0.0.0"
port = 9174

[storage]
# SQLite file holding thread resume state and API-key hashes.
#
# Relative values resolve against this file's directory, never the process
# cwd, so `deepseek-rs serve` launched from /tmp or a systemd unit uses the
# same threads and keys. Override with DB_PATH when you want a second
# instance on its own database.
db_path = "deepseek-rs.db"

[deepseek]
# Model id returned when a client does not request one.
model = "deepseek-chat"

# Default thinking flag for requests that do not specify one.
thinking = true

# Send the web-search flag. Leave this false unless you have a reason:
# thinking+search is throttled hard by the backend, and a mid-stream limit
# turns into a failed turn rather than a retry.
search = true

[channels.deepseek_web]
# Output budget for `/v1/responses`. DeepSeek's private API has no such
# parameter, so the proxy enforces it locally: once this many tokens (reasoning
# included) have been produced it stops forwarding and reports
# `status=incomplete` with `incomplete_details.reason=max_output_tokens`.
#
# A request above this value is rejected with `max_output_tokens_exceeded`;
# a request within it runs and may be truncated. Remove the key to keep
# `max_output_tokens` unsupported (fail closed) for this channel.
max_output_tokens = 384000

[limits]
# Seconds to wait after a request finishes before starting the next one on
# the same account. Completion-to-start, not start-to-start.
#
# 0.0 is the default and was measured to be safe for sequential traffic: 40
# back-to-back requests on one account, and 10 concurrent thinking+search
# requests, all returned 200 with no upstream rate-limit error. Raise this only
# if you actually see `rate_limit_reached` or "Messages too frequent".
request_delay_secs = 2

# Maximum simultaneous upstream requests per DeepSeek account. A value of 2
# allows independent Pi sessions to overlap while each session remains serial.
max_inflight_per_account = 2

# How many requests may queue behind a busy account before being rejected.
queue_limit = 64

# How long an account is skipped after a failed login, in seconds.
login_cooldown_secs = 300

# How long a request may wait for a busy account's rate slot, in seconds.
# Python: QUEUE_TIMEOUT. Without this a leaked slot blocks every later request
# on that account forever, silently — nothing is logged because no upstream
# call has been made yet. Times out as HTTP 503 queue_unavailable.
queue_timeout_secs = 120

# Wall-clock budget for one turn, in seconds (Python: REQUEST_TIMEOUT).
# A stalled upstream becomes a 504 request_timeout instead of a hang.
request_timeout_secs = 300

# SSE keep-alive interval in seconds (Python: HEARTBEAT_INTERVAL). Emits
# `: keep-alive` while the upstream is quiet; it does not abort the turn.
heartbeat_interval_secs = 10

# Retries for a throttled turn ("Messages too frequent", `rate_limit_reached`),
# applied BEFORE the first byte so streaming callers can still be retried.
# Mirrors the Python proxy's RATE_LIMIT_MAX_RETRIES / RATE_LIMIT_BACKOFF_S.
# The wait is backoff * min(attempt + 1, retries) and floors at 0.5s.
rate_limit_max_retries = 5
rate_limit_backoff_secs = 10.0

# Correction turns for malformed tool calls. 0 disables repair.
# Mirrors the Python proxy's TOOL_REPAIR_MAX_RETRIES.
tool_repair_max_retries = 5

# The tool-call wire format is re-asserted on EVERY turn, appended to the end
# of the outgoing prompt. The system prompt that teaches the format is only
# sent on the first turn, so long threads drift without this. Not tunable.
